# ============================================================================
# Data Paths Configuration
# ============================================================================
# Project base directories
project_path: ./

# ============================================================================
# Dataset Discovery Configuration
# ============================================================================
# This section controls how datasets are discovered and processed in the pipeline
dataset_discovery:
  # Find tiffs. Different patterns will correspond to different sessions
  tiff_patterns: ["*.tif"]

  # Exclude specific patterns from processing (dataset folder names)
  exclude_datasets:
    - ".*_test$"    # Exclude test datasets
    - ".*_backup$"  # Exclude backup datasets

  # Exclude specific session folder patterns (session folder names)
  exclude_sessions: []


# ============================================================================
# Preprocessing Configuration
# ============================================================================
# Controls the preprocessing steps applied to the data
preprocessing:
  # Output file naming pattern for preprocessed files
  # Use a suffix relevant for the set of operations you want to perform
  output_pattern: "" # "" for noop, "enhanced_" for contrast, "derotated_" for derotation, and "stiminterpolated_" for stiminterpolation

  # Define preprocessing steps and their parameters
  # They are mutually exclusive
  steps:
    # No operation, just copy the files
    - name: noop

    # Photostimulation-artefact removal by interpolation
    # - name: stiminterpolation
    #   kwargs:
    #     # Path to the stimulation TTL HDF5 file
    #     path_to_stim_h5: "path/to/stimulus_ttl.h5"
    #     save_metadata: true # Whether to save ScanImage metadata as a JSON file

    # Derotation
    # - name: derotation
    #   kwargs:
    #     # File pattern matching for input files
    #     glob_naming_pattern_tif: ["rotation_00001.tif"]
    #     glob_naming_pattern_bin: ["*rotation_1_001.bin"]
    #     path_to_stimulus_randperm: "/Users/lauraporta/local_data/stimlus_randperm.mat"

    # Contrast Enhancement (not required if using refImg_min_percentile in Suite2p)
    # - name: contrast
    #   kwargs:
    #     # Contrast enhancement parameters
    #     percentile_low: 1    # Lower percentile for contrast stretching
    #     percentile_high: 99  # Upper percentile for contrast stretching


# ============================================================================
# Motion Correction (photon-mosaic)
# ============================================================================
# Registration with photon-mosaic's suite2p backend. Reads the ScanImage
# TIFFs directly (use the noop preprocessing step), so frame rate and
# channel layout come from the ScanImage metadata.
registration:
  functional_channel: 1  # Channel to register and save (1-based, among saved channels)
  align_channel: 1  # Channel to estimate motion on (2 = align by a structural channel)
  two_step: false  # Register twice, 2nd time against the registered mean (low SNR)
  reg_tif: false  # Also write the registered functional channel as TIFF (reg_tif/)
  reg_tif_chan2: false  # Also write the other channel, registered, as TIFF (reg_tif_chan2/)

  # Passed straight to photon-mosaic's compute_motion(method="suite2p"): any
  # photon-mosaic Suite2pRegistrationSettings field or suite2p 1.x
  # registration setting. Anything not listed uses their defaults.
  suite2p:
    nonrigid: true  # Non-rigid (block-wise) registration
    block_size: [128, 128]  # Block size for non-rigid (pixels)
    max_nonrigid_shift: 5  # Max block shift (pixels); suite2p: maxregshiftNR
    maxregshift: 0.1  # Max rigid shift, as fraction of frame size
    batch_size: 500  # Frames per registration batch
    nimg_init: 300  # Frames for the reference image
    smooth_sigma: 1.15  # Spatial smoothing for registration
    smooth_sigma_time: 0  # Temporal smoothing; must be 0 with suite2p 1.x
    snr_thresh: 1.2  # Phase correlation threshold
    norm_frames: true  # Normalize frames when computing shifts
    th_badframes: 1.0  # Threshold for excluding frames
    spatial_taper: 40  # Edge pixels to ignore

# ============================================================================
# ROI Extraction (photon-mosaic)
# ============================================================================
# Suite2p ROI detection with photon-mosaic, run on the registered imaging
# from the Motion Correction step.
segmentation:
  algorithm: cellpose  # Detection algorithm: cellpose, sparsery or sourcery

  # Passed straight to photon-mosaic's run_segmentation(method="suite2p"):
  # any Suite2pSegmentationSettings field. Anything not listed uses its
  # default. fs defaults to the frame rate from the ScanImage metadata.
  suite2p:
    diameter: [12, 12]  # Expected cell diameter in pixels [y, x]; [30, 30] = Cellpose-SAM native scale
    tau: 1.0  # Indicator timescale (s): GCaMP6s ~1.5, GCaMP6f ~0.7
    device: cpu  # Torch device: cpu, cuda or mps
    threshold_scaling: 1.0  # Scale the detection threshold
    max_overlap: 0.75  # Remove ROIs overlapping more than this
    highpass_time: 100  # Temporal high-pass window (frames) before detection

# ============================================================================
# Suite2p Configuration
# ============================================================================
# Parameters for Suite2p processing pipeline
suite2p_ops:
  # Version and basic settings
  look_one_level_down: false  # Look in subfolders for tiffs
  fast_disk: []  # Location for temporary binary file
  delete_bin: false  # Delete binary file after registration
  mesoscan: false  # For scanimage mesoscope recordings
  bruker: false  # For single page BRUKER tiffs
  bruker_bidirectional: false  # For bidirectional BRUKER recordings

  # File handling settings
  h5py: []  # Path to h5py input file
  h5py_key: 'data'  # Key for h5py data array
  nwb_file: ''  # Path to NWB input file
  nwb_driver: ''  # Driver for NWB file
  nwb_series: ''  # TwoPhotonSeries name in NWB
  save_path0: ''  # Path for pipeline results
  save_folder: []  # Directory name for results
  subfolders: []  # Subfolders to process
  move_bin: false  # Move binary file to save_disk
  save_mat: false  # Save results in matlab format
  save_NWB: false  # Save output as NWB file
  split_multitiff: false # Split output of multiple tiffs

  # Acquisition parameters
  nplanes: 1  # Number of planes per tiff
  nchannels: 1  # Number of channels per plane
  functional_chan: 1  # Channel for functional ROIs (1-based)
  tau: 1.0  # Sensor timescale for deconvolution (1.0 for GCaMP6m)
  fs: 10.0  # Sampling rate per plane
  force_sktiff: false  # Use scikit-image for tiffs
  frames_include: -1  # Number of frames to process (-1 for all)
  multiplane_parallel: false  # Run pipeline on server
  ignore_flyback: []  # Planes to ignore as flyback

  # ROI detection settings
  roidetect: true  # Run ROI detection
  spikedetect: true  # Run spike detection
  sparse_mode: true  # Use sparse mode detection
  spatial_scale: 0  # Optimal scale in pixels (0 for auto)
  connected: true  # Require connected ROIs
  nbinned: 5000  # Max binned frames for detection
  max_iterations: 20  # Max detection iterations
  threshold_scaling: 1.0  # ROI detection threshold
  max_overlap: 0.75  # Max ROI overlap fraction
  high_pass: 100  # Running mean window
  spatial_hp_detect: 25  # Window for spatial high-pass
  denoise: false  # Denoise before detection
  # Recommended: keep > 0 (Cellpose path). Setting 0 routes through
  # suite2p's sparsedetect, which currently fails on numpy>=2 inside
  # suite2p-NIU 0.1.1 (sparsedetect.py:337).
  anatomical_only: 4  # Use Cellpose if > 0
  diameter: 0  # Cellpose diameter (0 for auto)
  cellprob_threshold: 0.0  # Cellpose detection threshold
  flow_threshold: 0.4  # Cellpose-SAM flow threshold
  spatial_hp_cp: 0  # Window for Cellpose high-pass
  pretrained_model: 'cpsam'  # Cellpose-SAM model

  # Neuropil extraction settings
  soma_crop: true  # Crop dendrites for stats
  neuropil_extract: true  # Extract neuropil signal
  inner_neuropil_radius: 2  # Pixels between ROI and neuropil
  min_neuropil_pixels: 350  # Min pixels for neuropil
  lam_percentile: 50.0  # Lambda percentile to ignore
  allow_overlap: false  # Extract from overlapping pixels

  # Classification settings
  use_builtin_classifier: false  # Use built-in classifier
  classifier_path: ''  # Path to classifier file
  chan2_thres: 0.65  # Threshold for channel 2 detection

  # Baseline settings
  baseline: 'maximin'  # Baseline computation method
  win_baseline: 60.0  # Window for maximin filter (s)
  sig_baseline: 10.0  # Gaussian filter width (s)
  prctile_baseline: 8.0  # Percentile for constant baseline
  neucoeff: 0.7  # Neuropil coefficient

# ============================================================================
# Neuropil Correction Configuration
# ============================================================================
# photon-mosaic ROI analyzer, on the cells from ROI Extraction. Each
# subsection is passed straight to the matching roi_analyzer.compute() call;
# anything not listed uses photon-mosaic's defaults.
neuropil_ops:
  neuropil:
    inner_neuropil_radius: 2  # Pixels between ROI and neuropil ring
    min_neuropil_pixels: 350  # Min pixels in the neuropil ring
  fluorescence:
    use_neuropil: true  # Subtract the neuropil
    neuropil_weight: 0.7  # Neuropil coefficient (Fc = F - neuropil_weight * Fneu)

# ============================================================================
# dF/F Calculation Configuration
# ============================================================================
# Passed straight to photon-mosaic's roi_analyzer.compute("df_over_f").
dff_ops:
  method: percentile  # Baseline F0: percentile, running_percentile or maximin (suite2p-style)
  win_baseline: 60.0  # Sliding baseline window (s)

# ============================================================================
# SLURM Configuration
# ============================================================================
# Settings for SLURM job scheduling system
use_slurm: false
slurm:
  slurm_partition: "gpu"  # GPU partition for processing
  mem_mb: 32000          # Memory allocation in MB
  tasks: 1               # Number of tasks
  nodes: 1               # Number of nodes to use

  # GPU-specific resources (will be set at rule level, not via --default-resources)
  # Uncomment and configure as needed:
  # gpu: 1                 # Number of GPUs to request
  # gres: "gpu:a100:1"     # Alternative: Generic Resource (GRES) specification
  # cpus_per_gpu: 4        # CPUs allocated per GPU
  # tasks_per_gpu: 0       # Tasks per GPU (set to 0 to disable --ntasks-per-gpu and avoid TRES conflicts)

  # Additional SLURM resources that can be specified:
  # runtime: 120           # Walltime limit in minutes
  # slurm_account: "account_name"  # SLURM account for resource tracking
  # constraint: "feature"  # Node feature requirements
  # mem_mb_per_cpu: 2000   # Memory per CPU (mutually exclusive with mem_mb)
